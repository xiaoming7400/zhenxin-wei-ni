name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --check
      - run: python scripts/check_site.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: female-intimacy-coach
          path: dist/*.zip
          if-no-files-found: error
